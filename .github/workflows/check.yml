name: CDC test date check

on:
  # Scheduled runs are DISABLED — monitoring moved to AWS (Lambda + EventBridge
  # Scheduler), so this workflow no longer runs on a timer.
  #
  # Kept as a manual fallback: if the AWS path is blocked or broken, this is a
  # one-click way to check, and re-enabling the timer is just uncommenting the
  # schedule block below.
  #
  # schedule:
  #   - cron: '0,30 0-10 * * *'   # 08:00-18:30 SGT
  #   - cron: '0 11 * * *'        # 19:00 SGT
  workflow_dispatch:

# Serialise runs so two checks can never race on the state commit.
concurrency:
  group: cdc-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to commit state.json back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chrome for Playwright
        run: npx playwright install --with-deps chrome

      - name: Check test date
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JITTER_MAX_SECONDS: '240'
        run: node src/check.mjs --jitter

      - name: Persist state
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update test date state [skip ci]"
            git push
          else
            echo "no state change"
          fi
